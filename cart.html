<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your bag — AFTER</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="page.css">
<style>
/* AFTER editorial polish — bag page */
:root{--ease-editorial:cubic-bezier(.22,.61,.36,1)}
body{-webkit-font-smoothing:antialiased}
main{animation:afterBagIn .65s var(--ease-editorial) both}
.cart-row,.summary,.empty,.cta{transition:transform .4s var(--ease-editorial),box-shadow .4s ease,border-color .3s ease}
.cart-row{box-shadow:0 8px 24px rgba(43,33,25,.025)}
.cart-row:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(43,33,25,.065)}
.summary{box-shadow:0 12px 34px rgba(43,33,25,.04)}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(23,23,25,.11)}
@keyframes afterBagIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* AFTER V2 — editorial shopping bag */
:root{--after-ease:cubic-bezier(.2,.75,.25,1)}
body{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.62),transparent 55%),var(--bg)}
.header{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.page-hero{padding-top:clamp(45px,6vw,78px);padding-bottom:clamp(24px,3vw,38px)}
.page-hero h1{letter-spacing:-.065em}
.page-hero p{max-width:580px;line-height:1.85}
.content{padding-bottom:55px}
.cart-layout{gap:clamp(22px,3vw,42px);align-items:start}
.cart-list{display:grid;gap:14px}
.cart-row{background:rgba(255,253,249,.88);border:1px solid rgba(31,25,20,.09);border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(43,33,25,.035);transition:transform .4s var(--after-ease),box-shadow .4s ease,border-color .3s ease}
.cart-row:hover{transform:translateY(-4px);border-color:rgba(185,130,76,.3);box-shadow:0 20px 42px rgba(43,33,25,.09)}
.cart-row img{border-radius:14px;box-shadow:0 5px 16px rgba(43,33,25,.07)}
.summary{position:sticky;top:22px;background:rgba(255,253,249,.92);border:1px solid rgba(31,25,20,.1);border-radius:22px;padding:25px;box-shadow:0 18px 48px rgba(43,33,25,.07);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.summary h3{font:500 29px var(--serif);letter-spacing:-.035em}
.sum-total{padding-top:16px}
.cta{border-radius:3px;box-shadow:0 8px 20px rgba(23,23,25,.08);transition:transform .35s var(--after-ease),box-shadow .35s ease}
.cta:hover{transform:translateY(-3px);box-shadow:0 15px 28px rgba(23,23,25,.16)}
.empty{border-radius:20px;padding:40px;background:rgba(255,253,249,.82);border:1px solid rgba(31,25,20,.08)}
.footer{margin-top:45px}
@media(max-width:760px){.summary{position:static;padding:20px}.cart-row{padding:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* AFTER V3 — editorial bag layout (presentation only) */
:root{--bg:#f1ebe2;--paper:#fffdf9;--accent:#a87849;--editorial-ease:cubic-bezier(.2,.75,.25,1)}
body{background:radial-gradient(ellipse at 85% 0%,rgba(255,255,255,.75),transparent 34rem),var(--bg);-webkit-font-smoothing:antialiased}
.header{height:76px;background:rgba(241,235,226,.8);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.page-hero{position:relative;padding-top:clamp(52px,7vw,92px);padding-bottom:clamp(30px,4vw,52px);border-bottom:1px solid rgba(23,23,25,.13)}.page-hero:after{content:'01  /  YOUR SELECTION';position:absolute;right:0;bottom:28px;color:var(--accent);font-size:8px;letter-spacing:.22em}.page-hero h1{font-size:clamp(56px,8vw,100px);line-height:.86;letter-spacing:-.075em}.page-hero p{font-size:12px;line-height:1.9;max-width:500px}.content{padding-top:34px}.cart-layout{grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:clamp(22px,4vw,55px)}.cart-list{gap:16px}.cart-row{display:grid;align-items:center;min-height:145px;background:rgba(255,253,249,.86);border:1px solid rgba(23,23,25,.09);border-radius:3px 18px 3px 18px;padding:18px;box-shadow:0 8px 28px rgba(43,33,25,.035)}.cart-row img{border-radius:3px 12px 3px 12px;background:#e9e0d5}.cart-row:hover{transform:translateX(3px);border-color:rgba(168,120,73,.32);box-shadow:0 18px 38px rgba(43,33,25,.085)}.summary{top:25px;border-radius:3px 22px 3px 22px;padding:clamp(22px,3vw,32px);background:linear-gradient(145deg,rgba(255,253,249,.97),rgba(246,239,230,.94));border:1px solid rgba(23,23,25,.12);box-shadow:0 24px 60px rgba(43,33,25,.08)}.summary:before{content:'ORDER SUMMARY';display:block;font-size:8px;letter-spacing:.24em;color:var(--accent);padding-bottom:15px;border-bottom:1px solid var(--line);margin-bottom:19px}.summary h3{font-size:34px;line-height:1;letter-spacing:-.055em}.sum-total{margin-top:20px;padding-top:20px;border-top:1px solid rgba(23,23,25,.17)}.cta{position:relative;overflow:hidden;border-radius:2px;min-height:50px;letter-spacing:.17em}.cta:hover{background:var(--accent);color:white;transform:translateY(-3px);box-shadow:0 15px 30px rgba(168,120,73,.2)}.empty{padding:clamp(32px,5vw,60px);border-radius:3px 22px 3px 22px;background:rgba(255,253,249,.84)}.footer{border-top:1px solid var(--line);padding-top:24px}
@media(max-width:760px){.page-hero:after{font-size:7px;bottom:15px}.cart-layout{grid-template-columns:1fr}.summary{position:static}.cart-row{min-height:unset}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}


/* AFTER — bag page editorial refinement */
body{background-image:radial-gradient(ellipse at 10% 18%,rgba(205,177,147,.16),transparent 34%),radial-gradient(ellipse at 94% 75%,rgba(180,148,113,.10),transparent 28%);background-attachment:fixed}
.header{background:rgba(244,239,232,.84);backdrop-filter:blur(16px)}
.page-hero{position:relative;border-bottom:1px solid rgba(25,24,22,.13);margin-bottom:30px}
.page-hero:after{content:'CURATED FOR YOU  ·  AFTER';display:block;margin-top:20px;font-size:9px;letter-spacing:.24em;color:#8a7764}
.page-hero h1{font-size:clamp(44px,7vw,82px)!important;line-height:.98!important;font-weight:500!important}
.cart-row{border-radius:4px!important;background:rgba(255,253,249,.78)!important;backdrop-filter:blur(10px);transition:transform .4s,box-shadow .4s,border-color .3s!important}
.cart-row:hover{transform:translateY(-3px)!important;border-color:rgba(166,111,67,.3)!important;box-shadow:0 20px 38px rgba(43,33,25,.09)!important}
.summary{border-radius:4px!important;background:rgba(255,253,249,.86)!important;backdrop-filter:blur(14px);border:1px solid rgba(31,25,20,.12)!important}
.cta{border-radius:3px!important;letter-spacing:.1em!important;transition:transform .3s,box-shadow .3s,letter-spacing .3s!important}
.cta:hover{transform:translateY(-3px)!important;letter-spacing:.14em!important}
.empty{border-radius:4px!important;border-style:dashed!important;background:rgba(255,253,249,.55)!important}
@media(prefers-reduced-motion:reduce){.cart-row,.cta{transition:none!important;animation:none!important}}

</style>

</head><body><div class="shell"><div class="topbar" id="announcement"></div><header class="header"><a class="brand" href="index.html"><svg class="mark home-logo-mark" viewBox="0 0 54 58" aria-hidden="true"><path d="M5 49 25 11 31 2 35 2 35 9 45 42Q47 48 53 49L53 52Q40 54 34 46L27 21 14 48Q11 53 5 52Z" fill="currentColor"/><path d="M4 49H15" stroke="currentColor" stroke-width="1.5"/></svg><span class="brand-name" id="brandName">AFTER</span></a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="categories.html">Categories</a><a href="blog.html">Blog</a><a href="about.html">About</a></nav><div class="actions"><a class="action" href="search.html">⌕</a><a class="bag" href="cart.html">BAG <span class="count" id="cartCount">0</span></a></div></header><main><section class="page-hero"><div class="kicker" id="eyebrow"></div><h1 id="title"></h1><p id="text"></p></section><section class="content"><div class="cart-layout"><div class="cart-list" id="cartList"></div><aside class="summary"><h3>Order summary</h3><div class="sum-line"><span>Items</span><span id="itemCount">0</span></div><div class="sum-line"><span>Subtotal</span><span id="subtotal">৳0</span></div><div class="sum-line"><span>Delivery</span><span>Calculated at checkout</span></div><div class="sum-line sum-total"><span>Total</span><span id="total">৳0</span></div><a class="cta" href="checkout.html?cart=1">CHECKOUT ↗</a></aside></div></section></main><footer class="footer"><span>© AFTER</span><span>YOUR BAG</span><a href="shop.html">CONTINUE SHOPPING ↗</a></footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="store-data.js"></script><script src="supabase-products.js"></script><script>
const S=getAfterStore(); document.documentElement.style.setProperty('--accent',S.accent); announcement.textContent=S.announcement; brandName.textContent=S.brand; eyebrow.textContent=S.pages.cart.eyebrow; title.textContent=S.pages.cart.title; text.textContent=S.pages.cart.text;
const key='afterCart'; let ids=JSON.parse(localStorage.getItem(key)||'[]');
const byId=id=>S.products.find(p=>p.id===id);
function grouped(){const m=new Map(); ids.forEach(id=>m.set(id,(m.get(id)||0)+1)); return [...m.entries()].map(([id,qty])=>({p:byId(id),qty})).filter(x=>x.p)}
function money(n){return '৳'+Number(n||0).toLocaleString('en-BD')}
function render(){const items=grouped(); const totalQty=items.reduce((a,x)=>a+x.qty,0); const subtotalAmount=items.reduce((a,x)=>a+(parseInt((x.p.price||'0').replace(/[^0-9]/g,''),10)||0)*x.qty,0); cartCount.textContent=totalQty; itemCount.textContent=totalQty; document.getElementById('subtotal').textContent=money(subtotalAmount); document.getElementById('total').textContent=money(subtotalAmount); cartList.innerHTML=items.length?items.map(x=>`<div class="cart-row"><img src="${x.p.image}" alt="${x.p.name}"><div><h3>${x.p.name}</h3><p>${x.p.category}</p><div style="margin-top:10px;font-size:10px;color:#777">Quantity: ${x.qty}</div></div><div><div class="cart-price">${x.p.price}</div><button onclick="removeItem('${x.p.id}')" style="border:0;background:none;color:#8a8178;font-size:9px;cursor:pointer;margin-top:7px">REMOVE</button></div></div>`).join(''):`<div class="empty"><strong>Your bag is waiting.</strong><p>Add something beautiful from the collection.</p><a class="cta" href="shop.html">EXPLORE SHOP ↗</a></div>`}
function removeItem(id){ids=ids.filter(x=>x!==id);localStorage.setItem(key,JSON.stringify(ids));render()} render();
</script></body></html>
