<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categories — AFTER</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="page.css"></head><body><div class="shell"><div class="topbar" id="announcement"></div><header class="header"><a class="brand" href="index.html"><svg class="mark home-logo-mark" viewBox="0 0 54 58" aria-hidden="true"><path d="M5 49 25 11 31 2 35 2 35 9 45 42Q47 48 53 49L53 52Q40 54 34 46L27 21 14 48Q11 53 5 52Z" fill="currentColor"/><path d="M4 49H15" stroke="currentColor" stroke-width="1.5"/></svg><span class="brand-name" id="brandName">AFTER</span></a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a class="active" href="categories.html">Categories</a><a href="blog.html">Blog</a><a href="about.html">About</a></nav><div class="actions"><a class="action" href="search.html">⌕</a><a class="bag" href="cart.html">BAG <span class="count" id="cartCount">0</span></a></div></header><main><section class="page-hero"><div class="kicker" id="eyebrow"></div><h1 id="title"></h1><p id="text"></p></section><section class="content"><div class="panel-grid" id="cats"></div></section></main><footer class="footer"><span>© AFTER</span><span>TECH / LIFESTYLE / EVERYDAY</span><a href="index.html">HOME ↗</a></footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="store-data.js"></script><script src="supabase-products.js"></script><script>
(async()=>{const S=getAfterStore();document.documentElement.style.setProperty('--accent',S.accent);announcement.textContent=S.announcement;brandName.textContent=S.brand;eyebrow.textContent=S.pages.categories.eyebrow;title.textContent=S.pages.categories.title;text.textContent=S.pages.categories.text;cartCount.textContent=Number(localStorage.getItem('afterCartCount')||0);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let categories=S.categories||[],products=S.products||[];
if(window.afterSupabase){try{const {data}=await window.afterSupabase.from('store_categories').select('id,name,slug,description,image_url,sort_order').eq('is_active',true).order('sort_order');if(data?.length)categories=data.map(c=>({id:c.id,name:c.name,count:`${products.filter(p=>String(p.category||'').toLowerCase()===c.name.toLowerCase()).length} items`,image:c.image_url,description:c.description}));}catch(e){console.warn('Cloud categories unavailable; using saved store categories.',e)}}
cats.innerHTML=categories.map((c,i)=>{const items=products.filter(p=>String(p.category||'').toLowerCase()===String(c.name||'').toLowerCase()||String(p.category||'').toLowerCase()===String(c.id||'').toLowerCase());return `<article class="category-card reveal" style="--delay:${i*70}ms"><a class="category-main" href="shop.html#${encodeURIComponent(c.id)}"><div class="category-image"><img src="${esc(c.image||'assets/hero-visual.jpg')}" alt="${esc(c.name)}" loading="lazy"><span class="category-number">0${i+1}</span></div><div class="category-copy"><div><h3>${esc(c.name)}</h3><p>${esc(c.description||`Explore thoughtfully selected ${c.name.toLowerCase()} essentials.`)}</p></div><span class="category-count">${items.length} ITEMS ↗</span></div></a><div class="category-products">${items.length?items.map(p=>`<a class="category-product" href="product.html?id=${encodeURIComponent(p.id)}"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"><span><strong>${esc(p.name)}</strong><small>${esc(p.price||'')}</small></span><b>↗</b></a>`).join(''):'<p class="category-empty">New products are coming soon.</p>'}</div></article>`}).join('');
const style=document.createElement('style');style.textContent='.panel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.category-card{display:block;color:inherit;text-decoration:none;background:#fffdf9;border:1px solid #ddd7cf;border-radius:18px;overflow:hidden;transition:transform .35s,box-shadow .35s;animation:catIn .6s both;animation-delay:var(--delay)}.category-card:hover{transform:translateY(-6px);box-shadow:0 22px 55px #17171912}.category-image{height:250px;background:#e7e0d7;position:relative;overflow:hidden}.category-image img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.category-card:hover .category-image img{transform:scale(1.05)}.category-main{display:block;color:inherit;text-decoration:none}.category-products{padding:0 18px 18px;display:grid;gap:8px}.category-product{display:flex;align-items:center;gap:11px;padding:9px;border:1px solid #e8e2da;border-radius:11px;text-decoration:none;color:inherit;background:#fff;transition:background .2s}.category-product:hover{background:#f6f1ea}.category-product img{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#eee8df}.category-product span{display:grid;gap:4px;flex:1}.category-product strong{font-size:11px;font-weight:600}.category-product small{font-size:10px;color:#8a8179}.category-product>b{font-size:13px}.category-empty{font-size:11px;color:#8a8179;padding:10px}.category-number{position:absolute;top:15px;left:15px;background:#fffdf9d9;padding:8px 10px;border-radius:999px;font-size:9px;letter-spacing:.12em}.category-copy{display:flex;justify-content:space-between;align-items:end;gap:12px;padding:21px}.category-copy h3{font:500 29px var(--serif);margin:0 0 7px}.category-copy p{font-size:11px;line-height:1.6;color:#77716b;margin:0;max-width:300px}.category-count{font-size:9px;letter-spacing:.08em;white-space:nowrap}@keyframes catIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:650px){.panel-grid{grid-template-columns:1fr}.category-image{height:220px}.category-copy h3{font-size:25px}}';document.head.appendChild(style);})();
</script></body></html>
