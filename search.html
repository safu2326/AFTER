<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search — AFTER</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="page.css"></head><body><div class="shell"><div class="topbar" id="announcement"></div><header class="header"><a class="brand" href="index.html"><svg class="mark home-logo-mark" viewBox="0 0 54 58" aria-hidden="true"><path d="M5 49 25 11 31 2 35 2 35 9 45 42Q47 48 53 49L53 52Q40 54 34 46L27 21 14 48Q11 53 5 52Z" fill="currentColor"/><path d="M4 49H15" stroke="currentColor" stroke-width="1.5"/></svg><span class="brand-name" id="brandName">AFTER</span></a><nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="categories.html">Categories</a><a href="blog.html">Blog</a><a href="about.html">About</a></nav><div class="actions"><a class="action" href="account.html">♙</a><a class="bag" href="cart.html">BAG <span class="count" id="cartCount">0</span></a></div></header><main><section class="page-hero"><div class="kicker" id="eyebrow"></div><h1 id="title"></h1><p id="text"></p><form class="search-box" id="form"><input id="q" autocomplete="off" placeholder="Search products…"><button>↗</button></form></section><section class="content results"><div class="result-grid" id="results"></div></section></main><footer class="footer"><span>© AFTER</span><span>SEARCH THE COLLECTION</span><a href="index.html">HOME ↗</a></footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="store-data.js"></script><script src="supabase-products.js"></script><script>const S=getAfterStore();document.documentElement.style.setProperty('--accent',S.accent);announcement.textContent=S.announcement;brandName.textContent=S.brand;eyebrow.textContent=S.pages.search.eyebrow;title.textContent=S.pages.search.title;text.textContent=S.pages.search.text;cartCount.textContent=Number(localStorage.getItem('afterCartCount')||0);const q=document.getElementById('q'),results=document.getElementById('results');function render(){const term=q.value.trim().toLowerCase();const list=S.products.filter(p=>!term||[p.name,p.category,p.description].join(' ').toLowerCase().includes(term));results.innerHTML=list.length?list.map(p=>`<a class="product-mini" href="product.html?id=${encodeURIComponent(p.id)}"><img src="${p.image}" alt="${p.name}"><div><small>${p.category}</small><strong>${p.name}</strong><small>${p.price}</small></div></a>`).join(''):`<div class="empty" style="grid-column:1/-1">No products found. Try another search.</div>`}form.addEventListener('submit',e=>{e.preventDefault();render()});q.addEventListener('input',render);render();</script></body></html>
