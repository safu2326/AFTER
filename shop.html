/* AFTER — editorial atmosphere upgrade */
:root{--accent:#a66f43;--accent-soft:#e8d7c5;--ink:#191816}
body{background-image:radial-gradient(ellipse at 8% 18%,rgba(205,177,147,.14),transparent 34%),radial-gradient(ellipse at 92% 48%,rgba(180,148,113,.10),transparent 28%);background-attachment:fixed}

<body>
<div class="scroll-progress" aria-hidden="true"><span></span></div>
<div class="cursor-glow" aria-hidden="true"></div>
<div class="shell">
<div class="announcement" id="announcement"></div>
<header class="header">
<a class="brand" href="index.html"><svg class="mark" viewBox="0 0 54 58"><path d="M5 49 25 11 31 2 35 2 35 9 45 42Q47 48 53 49L53 52Q40 54 34 46L27 21 14 48Q11 53 5 52Z" fill="currentColor"/><path d="M4 49H15" stroke="currentColor" stroke-width="1.5"/></svg><span class="divider"></span><span class="brand-name" id="brandName">AFTER</span></a>
<nav class="nav"><a href="index.html">Home</a><a class="active" href="shop.html">Shop</a><a href="categories.html">Categories</a><a href="blog.html">Blog</a><a href="about.html">About</a></nav>
<div class="actions"><a class="icon" href="search.html" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.1"/><path d="m16 16 5 5"/></svg></a><a class="icon" href="account.html" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.5"/><path d="M4.5 20c.5-4.1 3.1-6.2 7.5-6.2s7 2.1 7.5 6.2Z"/></svg></a><a class="icon" href="cart.html" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M2.5 3.5h2.7l2.2 12.1a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 1.9-1.5L22 8H6"/><circle cx="9.7" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg><span class="count" id="cartCount">0</span></a></div>
</header>
<main>
<section class="hero"><div class="hero-card"><div class="hero-image" id="heroImage"></div><div class="hero-content"><div class="eyebrow reveal" id="heroEyebrow"></div><h1 class="reveal d2" id="heroTitle"></h1><p class="reveal d3" id="heroText"></p><a class="hero-btn reveal d3" href="#featured"><span id="heroButton"></span><span>↗</span></a></div><div class="hero-badge" id="heroBadge"></div></div></section>
<section class="section scroll-section"><div class="section-head section-reveal"><div><p class="kicker" id="categoriesKicker">DISCOVER</p><h2 class="section-title" id="categoriesTitle"></h2></div><a class="view-all" id="categoriesViewAll" href="categories.html">VIEW ALL</a></div><div class="categories" id="categories"></div></section>
<section class="section scroll-section" id="featured"><div class="section-head section-reveal"><div><p class="kicker" id="featuredKicker">THE EDIT</p><h2 class="section-title" id="featuredTitle"></h2></div><a class="view-all" id="featuredViewAll" href="#new">SCROLL TO NEW</a></div><div class="products" id="featuredProducts"></div></section>
<section class="section scroll-section" id="new"><div class="section-head section-reveal"><div><p class="kicker" id="newKicker">JUST IN</p><h2 class="section-title" id="newTitle"></h2></div></div><div class="products" id="newProducts"></div></section>
<section class="feature scroll-section"><div class="feature-copy section-reveal"><p class="kicker" id="storyKicker">THE PHILOSOPHY</p><h2 id="storyTitle"></h2><p id="storyText"></p></div><div class="feature-art" id="storyArt"></div></section>
<section class="trust scroll-section" id="trustSection"></section>
</main><footer class="footer"><span id="footerLeft">© AFTER</span><span id="footerRight">TECH / LIFESTYLE / EVERYDAY</span></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="store-data.js"></script><script src="supabase-products.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const S=getAfterStore(); document.documentElement.style.setProperty('--accent',S.accent); document.getElementById('announcement').textContent=S.announcement; document.getElementById('brandName').textContent=S.brand; document.getElementById('heroEyebrow').textContent=S.heroEyebrow; document.getElementById('heroTitle').textContent=S.heroTitle; document.getElementById('heroText').textContent=S.heroText; document.getElementById('heroButton').textContent=S.heroButton; document.getElementById('heroBadge').textContent=S.heroBadge; document.getElementById('categoriesTitle').textContent=S.sectionCategories; document.getElementById('featuredTitle').textContent=S.sectionFeatured; document.getElementById('newTitle').textContent=S.sectionNew; document.getElementById('storyTitle').textContent=S.storyTitle; document.getElementById('storyText').textContent=S.storyText; document.getElementById('heroImage').style.backgroundImage=`url("${S.heroImage}")`; document.getElementById('storyArt').style.backgroundImage=`url("${S.heroImage}")`;document.getElementById('trustSection').innerHTML=(S.trustItems||[]).map(x=>`<div class="trust-item section-reveal"><strong>${esc(x.title)}</strong><span>${esc(x.text)}</span></div>`).join('');
if(S.logoImage){const img=document.createElement('img');img.src=S.logoImage;img.className='logo-image';document.querySelector('.mark').replaceWith(img)}
function card(p){return `<article class="product reveal-card" data-product-id="${esc(p.id)}" onclick="openProduct(event,'${esc(p.id)}')"><div class="product-img"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">${p.tag?`<span class="tag">${esc(p.tag)}</span>`:''}<button class="heart" aria-label="Wishlist"><svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.5-8.8 10-8.8 10s-8.8-4.5-8.8-10A4.6 4.6 0 0 1 12 6.1a4.6 4.6 0 0 1 8.8 2.7Z"/></svg></button></div><div class="product-info"><div class="product-cat">${esc(p.category)}</div><div class="product-name">${esc(p.name)}</div><div class="product-desc">${esc(p.description)}</div><div class="price-row"><span class="price">${esc(p.price)}</span>${p.oldPrice?`<span class="old">${esc(p.oldPrice)}</span>`:''}<button class="add" onclick="addCart('${esc(p.id)}',event)">ADD</button></div></div></article>`}
document.getElementById('categories').innerHTML=S.categories.map(c=>`<a class="cat reveal-card" href="categories.html"><img src="${esc(c.image)}" alt="${esc(c.name)}"><div class="cat-copy"><strong>${esc(c.name)}</strong><span>${esc(c.count)}</span></div></a>`).join('');
document.getElementById('featuredProducts').innerHTML=S.products.filter(p=>p.featured).slice(0,8).map(card).join(''); document.getElementById('newProducts').innerHTML=S.products.filter(p=>p.new).slice(0,8).map(card).join('');
let cartItems=JSON.parse(localStorage.getItem('afterCart')||'[]');let count=cartItems.length;document.getElementById('cartCount').textContent=count;function addCart(id,e){if(e){e.preventDefault();e.stopPropagation()}if(id)cartItems.push(id);else cartItems.push(S.products[0]?.id);localStorage.setItem('afterCart',JSON.stringify(cartItems));localStorage.setItem('afterCartCount',cartItems.length);count=cartItems.length;document.getElementById('cartCount').textContent=count}function openProduct(e,id){if(e.target.closest('.heart,.add'))return;window.location.href='product.html?id='+encodeURIComponent(id)}

/* AFTER Store motion layer */
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const progress=document.querySelector('.scroll-progress span');
const glow=document.querySelector('.cursor-glow');
function updateScroll(){
  const max=document.documentElement.scrollHeight-window.innerHeight;
  const pct=max>0?(window.scrollY/max)*100:0;
  if(progress) progress.style.width=pct+'%';
}
window.addEventListener('scroll',updateScroll,{passive:true}); updateScroll();

if(!reduceMotion){
  const observer=new IntersectionObserver((entries)=>{
    entries.forEach((entry)=>{
      if(entry.isIntersecting){
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  },{threshold:.12,rootMargin:'0px 0px -35px'});
  document.querySelectorAll('.section-reveal,.reveal-card,.trust-item').forEach(el=>observer.observe(el));

  // Soft mouse light on desktop — deliberately subtle so the store stays premium.
  if(window.matchMedia('(pointer:fine)').matches && glow){
    window.addEventListener('pointermove',(e)=>{
      glow.style.transform=`translate3d(${e.clientX-180}px,${e.clientY-180}px,0)`;
    },{passive:true});
    document.querySelectorAll('.product,.cat,.hero-btn').forEach(el=>{
      el.addEventListener('mouseenter',()=>glow.classList.add('active'));
      el.addEventListener('mouseleave',()=>glow.classList.remove('active'));
    });
  }

  // Gentle 3D tilt for product/category cards on desktop.
  if(window.matchMedia('(pointer:fine)').matches){
    document.querySelectorAll('.product,.cat').forEach(cardEl=>{
      cardEl.addEventListener('pointermove',(e)=>{
        const r=cardEl.getBoundingClientRect();
        const x=(e.clientX-r.left)/r.width-.5;
        const y=(e.clientY-r.top)/r.height-.5;
        cardEl.style.setProperty('--rx',`${(-y*2.5).toFixed(2)}deg`);
        cardEl.style.setProperty('--ry',`${(x*2.5).toFixed(2)}deg`);
      });
      cardEl.addEventListener('pointerleave',()=>{
        cardEl.style.setProperty('--rx','0deg'); cardEl.style.setProperty('--ry','0deg');
      });
    });
  }
}

// Cart feedback: a small, elegant pulse instead of a jarring alert.
const originalAddCart=window.addCart;
window.addCart=function(){
  originalAddCart();
  const c=document.getElementById('cartCount');
  c.classList.remove('cart-pop'); void c.offsetWidth; c.classList.add('cart-pop');
};

// Heart micro-interaction.
document.querySelectorAll('.heart').forEach(btn=>btn.addEventListener('click',(e)=>{
  e.preventDefault(); e.stopPropagation();
  btn.classList.toggle('liked');
}));

// Cloud Shop Settings: public visitors read the single settings row from Supabase.
(async function loadCloudShopSettings(){
  try {
    if(!window.afterSupabase) return;
    const {data,error}=await window.afterSupabase.from('shop_settings').select('settings').eq('id','default').maybeSingle();
    if(error || !data || !data.settings) { if(error) console.warn('Shop settings cloud load:',error.message); return; }
    const c=data.settings, setText=(id,v)=>{const e=document.getElementById(id);if(e&&v!==undefined&&v!==null&&String(v).trim()!=='')e.textContent=String(v)};
    const setImage=(id,v)=>{const e=document.getElementById(id);if(e&&v)e.style.backgroundImage='url("'+String(v).replace(/["\\]/g,'')+'")'};
    setText('announcement',c.announcement);setText('brandName',c.brand);setText('heroEyebrow',c.heroEyebrow);setText('heroTitle',c.heroTitle);setText('heroText',c.heroText);setText('heroButton',c.heroButton);setText('heroBadge',c.heroBadge);
    setText('categoriesKicker',c.categoriesKicker);setText('categoriesTitle',c.sectionCategories);setText('categoriesViewAll',c.categoriesViewAll);
    setText('featuredKicker',c.featuredKicker);setText('featuredTitle',c.sectionFeatured);setText('featuredViewAll',c.featuredViewAll);
    setText('newKicker',c.newKicker);setText('newTitle',c.sectionNew);setText('storyKicker',c.storyKicker);setText('storyTitle',c.storyTitle);setText('storyText',c.storyText);setText('footerLeft',c.footerLeft);setText('footerRight',c.footerRight);
    if(c.heroImage){setImage('heroImage',c.heroImage);document.getElementById('heroImage').classList.add('is-ready')}setImage('storyArt',c.storyImage||c.heroImage);
    if(c.accent)document.documentElement.style.setProperty('--accent',c.accent);
    const trustSection=document.getElementById('trustSection');
    const cloudTrustItems=Array.isArray(c.trustItems)?c.trustItems.filter(x=>x&&String(x.title||'').trim()&&String(x.text||'').trim()):[];
    const hasNumberedTrust=[1,2,3].some(i=>String(c['trust'+i+'Title']||'').trim()||String(c['trust'+i+'Text']||'').trim());
    if(cloudTrustItems.length){trustSection.innerHTML=cloudTrustItems.map(x=>'<div class="trust-item section-reveal"><strong>'+esc(x.title)+'</strong><span>'+esc(x.text)+'</span></div>').join('')}
    else if(hasNumberedTrust){trustSection.innerHTML=[1,2,3].map(i=>{const title=String(c['trust'+i+'Title']||'').trim(),text=String(c['trust'+i+'Text']||'').trim();return title||text?'<div class="trust-item section-reveal"><strong>'+esc(title)+'</strong><span>'+esc(text)+'</span></div>':''}).join('')}
    // If cloud trust values are absent/empty, preserve the existing local fallback instead of blanking the section.
  } catch(e){console.warn('Cloud shop settings unavailable; showing existing local settings.',e)}
})();
</script></body></html>
