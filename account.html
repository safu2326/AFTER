<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Sign in to AFTER." />
  <title>Login — AFTER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--red:#df0016;--ink:#171719;--muted:#696866;--line:#d7d7d7;--paper:#fff;--sand:#d8c7b0;--sans:'DM Sans',Arial,sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:var(--sans);color:var(--ink);background:#fff}
    body{overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    .login-page{min-height:100svh;display:grid;grid-template-columns:42.4% 57.6%;background:#fff;overflow:hidden}

    /* LEFT / LOGIN PANEL */
    .login-panel{position:relative;z-index:3;background:#fff;min-height:100svh;display:flex;justify-content:center;align-items:flex-start;padding:8.8vh 7.5% 7vh;box-shadow:10px 0 35px rgba(0,0,0,.025);animation:panel-in .95s cubic-bezier(.18,.75,.18,1) both}
    .login-inner{width:min(100%,390px);position:relative}
    .brand-home{display:flex;align-items:center;justify-content:center;width:max-content;margin:0 auto 34px;gap:13px;transition:transform .25s ease,opacity .25s ease}
    .brand-home:hover{transform:translateY(-2px);opacity:.7}
    .brand-mark{width:44px;height:48px;color:#151517;flex:0 0 auto}
    .brand-divider{width:1px;height:27px;background:#8f8f8f}
    .brand-name{font-size:20px;letter-spacing:.31em;font-weight:500;padding-left:2px}
    .bear-wrap{height:76px;display:flex;justify-content:center;align-items:flex-end;margin:-2px 0 -2px}
    .bear-button{width:84px;height:76px;border:0;background:transparent;padding:0;cursor:pointer;position:relative;display:block;transform-origin:50% 100%;z-index:1}
    .bear-button.bear-face-sleep{animation:sleep-breathe 2.8s ease-in-out infinite}
    .bear-face-sleep .bear-head{animation:sleep-nod 2.8s ease-in-out infinite}
    .sleep-z{position:absolute;left:calc(50% + 32px);top:0;color:#9b8c82;font-family:Georgia,serif;font-weight:600;line-height:1;pointer-events:none;opacity:0;animation:zzz-float 2.5s ease-in-out infinite}
    .sleep-z.z-one{font-size:14px;animation-delay:0s}
    .sleep-z.z-two{font-size:11px;left:calc(50% + 45px);top:7px;animation-delay:.8s}
    .sleep-z.z-three{font-size:9px;left:calc(50% + 55px);top:1px;animation-delay:1.55s}
    .bear-wrap:has(.bear-face-awake) .sleep-z,.bear-wrap:has(.bear-face-cover) .sleep-z,.bear-wrap:has(.bear-typing) .sleep-z{display:none}
    .bear-svg{width:84px;height:76px;display:block;overflow:visible}
    .bear-head{transform-origin:50% 80%;transition:transform .28s ease}
    .bear-eye{transition:opacity .2s ease}
    .bear-eye.open{opacity:1}.bear-eye.closed{opacity:0}
    .bear-hand{opacity:0;transform-origin:center;transition:opacity .25s ease,transform .25s ease}
    .bear-face-awake .bear-eye.closed{opacity:0}.bear-face-awake .bear-eye.open{opacity:1}
    .bear-face-sleep .bear-eye.closed{opacity:1}.bear-face-sleep .bear-eye.open{opacity:0}
    .bear-face-cover .bear-eye.closed{opacity:0}.bear-face-cover .bear-eye.open{opacity:0}
    .bear-face-cover .bear-hand{opacity:1}
    .bear-face-cover .bear-hand.left{transform:translate(7px,-1px) rotate(-12deg)}
    .bear-face-cover .bear-hand.right{transform:translate(-7px,-1px) rotate(12deg)}
    .bear-typing .bear-head{animation:bear-type .58s ease-in-out infinite alternate}
    .bear-typing .bear-ear{animation:ear-wiggle .55s ease-in-out infinite alternate}
    .bear-face-sleep .bear-svg{animation:bear-sleep 2.8s ease-in-out infinite;transform-origin:50% 100%}
    .sleep-zs{position:absolute;right:-3px;top:-7px;width:36px;height:35px;pointer-events:none;opacity:0;transition:opacity .3s ease}
    .bear-face-sleep .sleep-zs{opacity:1}
    .sleep-zs i{position:absolute;font-style:normal;font-weight:700;color:#8e9aab;text-shadow:0 2px 5px rgba(90,105,125,.12);animation:zzz-float 2.1s ease-in-out infinite}
    .sleep-zs i:nth-child(1){right:2px;top:0;font-size:13px;animation-delay:0s}
    .sleep-zs i:nth-child(2){right:14px;top:8px;font-size:10px;animation-delay:.55s}
    .sleep-zs i:nth-child(3){right:23px;top:18px;font-size:8px;animation-delay:1.1s}
    .login-form{margin-top:1px}
    .field{display:block;margin-top:18px}
    .field:first-of-type{margin-top:0}
    .field-label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
    .field input{width:100%;height:48px;border:1px solid #cfcfcf;background:#fff;border-radius:2px;padding:0 13px;font-size:15px;color:#1a1a1a;outline:none;transition:border-color .2s,box-shadow .2s}
    .field input:focus{border-color:#a9a9a9;box-shadow:0 0 0 3px rgba(0,0,0,.045)}
    .password-wrap{position:relative}
    .password-wrap input{padding-right:48px}
    .password-eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:#777;cursor:pointer;border-radius:50%;display:grid;place-items:center}
    .password-eye:hover{background:#f5f5f5;color:#222}
    .password-eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .form-row{display:flex;align-items:center;justify-content:space-between;margin-top:21px;gap:15px;font-size:13px}
    .remember{display:flex;align-items:center;gap:8px;color:#4b4b4b;cursor:pointer;white-space:nowrap}
    .remember input{width:14px;height:14px;accent-color:#999;cursor:pointer}
    .forgot{color:var(--red);font-weight:600;cursor:pointer;background:none;border:0;padding:0;font-size:13px}
    .forgot:hover{text-decoration:underline}
    .login-btn{width:100%;height:54px;border:0;border-radius:3px;background:var(--red);color:#fff;font-weight:600;font-size:17px;cursor:pointer;margin-top:27px;box-shadow:0 7px 18px rgba(223,0,22,.13);transition:transform .22s,box-shadow .22s,filter .22s}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(223,0,22,.18);filter:saturate(1.06)}
    .login-btn:active{transform:translateY(0) scale(.99)}
    .divider{display:flex;align-items:center;gap:15px;color:#777;font-size:14px;margin:48px 0 28px}
    .divider::before,.divider::after{content:"";height:1px;background:#d8d8d8;flex:1}
    .google-btn{width:100%;height:54px;border:1px solid #d4d4d4;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:23px;color:#2e2e2e;font-size:14px;font-weight:500;cursor:pointer;transition:box-shadow .25s,transform .25s,border-color .25s}
    .google-btn:hover{transform:translateY(-2px);border-color:#bdbdbd;box-shadow:0 8px 22px rgba(0,0,0,.08)}
    .google-g{width:22px;height:22px;display:block}
    .status{min-height:20px;margin:13px 0 0;text-align:center;font-size:12px;color:#777}
    .status.error{color:#c00015}.status.success{color:#21723b}
    .small-note{margin-top:13px;text-align:center;color:#999;font-size:10px;line-height:1.5}

    /* RIGHT / VISUAL */
    .visual-panel{position:relative;min-height:100svh;overflow:hidden;background:#d9c8b2;isolation:isolate}
    .visual-image{position:absolute;inset:0;background-image:url('assets/hero-visual.jpg');background-size:cover;background-position:72% center;transform:scale(1.02);animation:visual-in 1.2s cubic-bezier(.2,.7,.2,1) both}
    .visual-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(216,200,180,.06),rgba(216,200,180,.03));pointer-events:none}
    .top-nav{position:absolute;z-index:4;right:4.4%;top:20px;display:flex;align-items:center;gap:clamp(28px,3.4vw,52px);font-size:13px;font-weight:600}
    .top-nav a{position:relative;padding:6px 0;color:#151515;text-shadow:0 1px 3px rgba(255,255,255,.18)}
    .top-nav a::after{content:"";position:absolute;left:0;bottom:1px;width:100%;height:1.5px;background:#171717;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
    .top-nav a:hover::after{transform:scaleX(1)}
    .visual-copy{position:absolute;z-index:3;top:15%;right:2.8%;width:min(270px,30%);animation:copy-in 1s .35s cubic-bezier(.2,.7,.2,1) both}
    .visual-eyebrow{display:flex;align-items:center;gap:13px;color:#4e4a45;font-size:11px;letter-spacing:.31em;font-weight:600;margin:0 0 21px}
    .visual-eyebrow::after{content:"";width:48px;height:1px;background:rgba(72,68,63,.4)}
    .visual-copy h1{margin:0;font-size:clamp(34px,2.8vw,43px);line-height:1.04;letter-spacing:-.045em;font-weight:400;color:#181719}
    .visual-copy h1 span{color:#bd8750}
    .visual-copy p{margin:20px 0 0;color:#57524c;font-size:14px;line-height:1.55}
    .visual-copy p em{font-style:italic}
    .promises{display:flex;align-items:flex-start;margin-top:28px;gap:16px}
    .promise{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;color:#514d47;font-size:10px;line-height:1.25;min-width:68px}
    .promise svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
    .promise-sep{width:1px;height:45px;background:rgba(67,62,57,.27);margin-top:1px}
    .toast{position:fixed;z-index:20;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#171719;color:#fff;padding:12px 18px;border-radius:8px;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.16);transition:opacity .25s,transform .25s}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @keyframes panel-in{from{transform:translateX(-100%)}to{transform:translateX(0)}}
    @keyframes visual-in{from{opacity:.4;transform:scale(1.07)}to{opacity:1;transform:scale(1.02)}}
    @keyframes copy-in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes bear-type{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-3px) rotate(2deg)}}
    @keyframes sleep-breathe{0%,100%{transform:translateY(1px) scaleX(1) scaleY(.99)}50%{transform:translateY(-1px) scaleX(1.025) scaleY(1.015)}}
    @keyframes sleep-nod{0%,100%{transform:rotate(2deg) translateY(1px)}50%{transform:rotate(-2deg) translateY(0)}}
    @keyframes zzz-float{0%{opacity:0;transform:translate(0,7px) scale(.8)}20%{opacity:.8}75%{opacity:.65}100%{opacity:0;transform:translate(8px,-18px) scale(1.1)}}
    @keyframes ear-wiggle{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
    @keyframes bear-sleep{0%,100%{transform:translateY(1px) rotate(-1deg) scaleY(.99)}50%{transform:translateY(-2px) rotate(1deg) scaleY(1.015)}}
    @keyframes zzz-float{0%{opacity:0;transform:translate(3px,8px) scale(.8)}25%{opacity:.95}100%{opacity:0;transform:translate(-5px,-13px) scale(1.12)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.login-panel{transform:none}}

    @media (max-width:900px){
      .login-page{grid-template-columns:1fr;min-height:100svh}
      .visual-panel{min-height:620px;order:-1}
      .login-panel{min-height:auto;padding:54px 8% 70px}
      .top-nav{right:5%;gap:22px}
      .visual-copy{top:25%;right:5%;width:40%;max-width:300px}
      .visual-copy h1{font-size:clamp(34px,5.5vw,46px)}
    }
    @media (max-width:620px){
      .visual-panel{min-height:470px}
      .visual-image{background-position:62% center}
      .top-nav{top:13px;right:6%;gap:17px;font-size:11px}
      .visual-copy{top:20%;right:5%;width:45%;}
      .visual-eyebrow{font-size:8px;letter-spacing:.2em;margin-bottom:12px}
      .visual-copy h1{font-size:clamp(28px,6.8vw,38px)}
      .visual-copy p{font-size:12px;margin-top:14px}
      .promises{gap:8px;margin-top:20px}
      .promise{font-size:8px;min-width:52px}
      .promise svg{width:22px;height:22px}
      .promise-sep{height:36px}
      .login-panel{padding:38px 7% 58px}
      .brand-home{margin-bottom:25px}
      .form-row{font-size:12px}.forgot{font-size:12px}
    }
    @media (max-width:390px){
      .visual-panel{min-height:440px}
      .top-nav{gap:12px;font-size:10px}
      .visual-copy{width:47%;top:20%;right:4%}
      .promises{display:none}
      .login-panel{padding-left:6%;padding-right:6%}
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="login-panel" aria-label="AFTER account login">
      <div class="login-inner">
        <a class="brand-home" href="index.html" aria-label="Back to AFTER home">
          <svg class="brand-mark" viewBox="0 0 54 58" aria-hidden="true"><path d="M5 49 25 11 31 2 35 2 35 9 45 42Q47 48 53 49L53 52Q40 54 34 46L27 21 14 48Q11 53 5 52Z" fill="currentColor"/><path d="M4 49H15" stroke="currentColor" stroke-width="1.5"/></svg>
          <span class="brand-divider"></span><span class="brand-name">AFTER</span>
        </a>

        <div class="bear-wrap">
          <span class="sleep-z z-one" aria-hidden="true">Z</span><span class="sleep-z z-two" aria-hidden="true">z</span><span class="sleep-z z-three" aria-hidden="true">z</span>
          <button class="bear-button bear-face-sleep" id="bearButton" type="button" aria-label="Show or hide password">
            <svg class="bear-svg" viewBox="0 0 120 108" aria-hidden="true">
              <g class="bear-head">
                <circle class="bear-ear" cx="30" cy="29" r="15" fill="#c9896b" stroke="#3d2723" stroke-width="2"/>
                <circle class="bear-ear" cx="90" cy="29" r="15" fill="#c9896b" stroke="#3d2723" stroke-width="2"/>
                <circle cx="30" cy="29" r="8" fill="#e7aa91"/><circle cx="90" cy="29" r="8" fill="#e7aa91"/>
                <rect x="25" y="25" width="70" height="58" rx="29" fill="#d99574" stroke="#3d2723" stroke-width="2"/>
                <path class="bear-eye open" d="M42 48q4-4 8 0M70 48q4-4 8 0" fill="none" stroke="#291c1a" stroke-width="2.4" stroke-linecap="round"/>
                <path class="bear-eye closed" d="M42 48l7 0M71 48l7 0" fill="none" stroke="#291c1a" stroke-width="2.4" stroke-linecap="round"/>
                <ellipse cx="60" cy="58" rx="12" ry="9" fill="#efc3ad"/>
                <path d="M56 56q4-3 8 0" fill="none" stroke="#291c1a" stroke-width="2" stroke-linecap="round"/>
                <path d="M60 59v4q-4 3-7 0M60 63q4 3 7 0" fill="none" stroke="#291c1a" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M33 57h-9M87 57h9" stroke="#8d5d51" stroke-width="1.3" stroke-linecap="round" opacity=".55"/>
                <g class="bear-hand left"><ellipse cx="39" cy="54" rx="10" ry="22" fill="#d99574" stroke="#3d2723" stroke-width="2"/></g>
                <g class="bear-hand right"><ellipse cx="81" cy="54" rx="10" ry="22" fill="#d99574" stroke="#3d2723" stroke-width="2"/></g>
              </g>
              <path d="M47 84q13 11 26 0" fill="none" stroke="#3d2723" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="sleep-zs" aria-hidden="true"><i>Z</i><i>z</i><i>z</i></span>
          </button>
        </div>

        <form class="login-form" id="loginForm" novalidate>
          <label class="field">
            <span class="field-label">Username or E-mail</span>
            <input id="username" name="username" type="text" autocomplete="username" inputmode="email" required />
          </label>

          <label class="field">
            <span class="field-label">Password</span>
            <span class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" required />
              <button class="password-eye" id="passwordEye" type="button" aria-label="Show password">
                <svg viewBox="0 0 24 24"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </button>
            </span>
          </label>

          <div class="form-row">
            <label class="remember"><input id="remember" type="checkbox" /> <span>Remember me</span></label>
            <button class="forgot" id="forgotButton" type="button">Forgot Password?</button>
          </div>

          <button class="login-btn" type="submit">Login</button>
          <p class="status" id="status" aria-live="polite"></p>
        </form>

        <div class="divider"><span>Or</span></div>
        <button class="google-btn" id="googleButton" type="button">
          <svg class="google-g" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h6.45a5.52 5.52 0 0 1-2.4 3.62v3.01h3.89c2.28-2.1 3.55-5.2 3.55-8.66Z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.89-3.01c-1.07.72-2.44 1.15-4.06 1.15-3.12 0-5.76-2.11-6.71-4.95H1.27v3.1A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.29 14.29A7.22 7.22 0 0 1 4.91 12c0-.8.14-1.57.38-2.29V6.61H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.39l4.02-3.1Z"/><path fill="#EA4335" d="M12 4.76c1.76 0 3.35.61 4.6 1.81l3.45-3.45C17.95 1.09 15.24 0 12 0A12 12 0 0 0 1.27 6.61l4.02 3.1C6.24 6.87 8.88 4.76 12 4.76Z"/></svg>
          <span>Continue with Google</span>
        </button>
        <p class="small-note">Secure sign-in is required before connecting a real customer account system.</p>
      </div>
    </section>

    <section class="visual-panel" aria-label="AFTER technology lifestyle">
      <div class="visual-image"></div>
      <div class="visual-overlay"></div>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="blog.html">Blog</a>
        <a href="about.html">About</a>
      </nav>
      <div class="visual-copy">
        <p class="visual-eyebrow" id="accountEyebrow">TECH &amp; GADGETS</p>
        <h1 id="accountTitle">Smarter<br>Living Starts<br><span>Here.</span></h1>
        <p id="accountText">Latest gadgets. Better<br>connectivity. <em>A smarter you.</em></p>
        <div class="promises" aria-label="AFTER service promises">
          <div class="promise"><svg viewBox="0 0 32 32"><path d="M16 2 27 7v8c0 7-4.6 11.4-11 14-6.4-2.6-11-7-11-14V7Z"/><path d="m11 16 3.2 3.1L21.5 12"/></svg><span>Trusted<br>Quality</span></div>
          <span class="promise-sep"></span>
          <div class="promise"><svg viewBox="0 0 32 32"><path d="M2 8h18v15H2zM20 13h6l4 5v5H20z"/><circle cx="8" cy="26" r="2.2"/><circle cx="25" cy="26" r="2.2"/></svg><span>Fast<br>Delivery</span></div>
          <span class="promise-sep"></span>
          <div class="promise"><svg viewBox="0 0 32 32"><path d="M5 17v-3a11 11 0 0 1 22 0v3M5 17H3v7h6v-7H5Zm22 0h2v7h-6v-7h4Z"/><path d="M25 25c-2.2 2.8-5.2 4-9 4"/></svg><span>24/7<br>Support</span></div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Google Identity Services. Replace the placeholder client ID in the script below before production. -->
  <script src="store-data.js"></script>
  <script>
    const pageStore = getAfterStore();
    document.documentElement.style.setProperty('--red', pageStore.accent);
    if(pageStore.pages && pageStore.pages.account){
      document.getElementById('accountEyebrow').textContent = pageStore.pages.account.eyebrow;
      document.getElementById('accountTitle').textContent = pageStore.pages.account.title;
      document.getElementById('accountText').textContent = pageStore.pages.account.text;
    }
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    /* ============================================================
       AFTER LOGIN CONFIGURATION
       ------------------------------------------------------------
       This static version includes a demo credential check so the
       page can be tested immediately. For a real store, move the
       credential check to your server/database and never keep real
       passwords in this file.
       ============================================================ */
    const AFTER_LOGIN = {
      demoUsername: 'admin',
      demoPassword: 'after1234',
      masterUsername: 'safu2326',
      masterPassword: '2229747898',
      googleClientId: 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com'
    };

    const $ = (selector) => document.querySelector(selector);
    const username = $('#username');
    const password = $('#password');
    const bearButton = $('#bearButton');
    const loginForm = $('#loginForm');
    const status = $('#status');
    const passwordEye = $('#passwordEye');
    const googleButton = $('#googleButton');
    const toast = $('#toast');

    let passwordVisible = false;
    let googleReady = false;

    function setBear(mode) {
      bearButton.classList.remove('bear-face-sleep','bear-face-awake','bear-face-cover','bear-typing');
      bearButton.classList.add(`bear-face-${mode}`);
    }

    username.addEventListener('focus', () => setBear('awake'));
    username.addEventListener('input', () => {
      setBear(username.value ? 'typing' : 'awake');
    });
    username.addEventListener('blur', () => {
      if (!password.matches(':focus')) setBear(username.value ? 'awake' : 'sleep');
    });

    password.addEventListener('focus', () => setBear('cover'));
    password.addEventListener('input', () => setBear('cover'));
    password.addEventListener('blur', () => {
      if (!username.matches(':focus')) setBear('sleep');
    });

    function togglePassword() {
      passwordVisible = !passwordVisible;
      password.type = passwordVisible ? 'text' : 'password';
      passwordEye.setAttribute('aria-label', passwordVisible ? 'Hide password' : 'Show password');
      setBear(passwordVisible ? 'awake' : 'cover');
    }

    passwordEye.addEventListener('click', togglePassword);
    bearButton.addEventListener('click', () => {
      if (document.activeElement === password || password.value) togglePassword();
      else username.focus();
    });

    function showStatus(message, type='') {
      status.textContent = message;
      status.className = `status ${type}`.trim();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 3600);
    }

    function goToStore() {
      sessionStorage.setItem('afterLoggedIn', 'true');
      window.location.href = 'shop.html';
    }

    function goToAdmin() {
      sessionStorage.setItem('afterAdmin', 'true');
      localStorage.setItem('afterAdmin', 'true');
      window.location.href = 'admin.html';
    }

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const user = username.value.trim();
      const pass = password.value;
      if (!user || !pass) {
        showStatus('Please enter your username/e-mail and password.', 'error');
        return;
      }

      /* Master login: opens the private store control panel. */
      if (user.toLowerCase() === AFTER_LOGIN.masterUsername.toLowerCase() && pass === AFTER_LOGIN.masterPassword) {
        showStatus('Master access granted. Opening control panel…', 'success');
        window.setTimeout(goToAdmin, 450);
        return;
      }

      /* Demo customer login. Replace with a real authentication API before launch. */
      if (user.toLowerCase() === AFTER_LOGIN.demoUsername.toLowerCase() && pass === AFTER_LOGIN.demoPassword) {
        if ($('#remember').checked) localStorage.setItem('afterRememberedUser', user);
        showStatus('Login successful. Opening store…', 'success');
        window.setTimeout(goToStore, 450);
      } else {
        showStatus('Username or password is incorrect.', 'error');
      }
    });

    $('#forgotButton').addEventListener('click', () => {
      showToast('Password recovery needs to be connected to your e-mail/server system.');
    });

    /* ------------------------------------------------------------
       Google sign-in
       ------------------------------------------------------------
       Google does not allow a normal website to read every Gmail
       account on a device. Google Identity Services shows the
       accounts/chooser through Google's own secure UI after the
       site is configured with an OAuth client ID.
    */
    function handleGoogleCredential(response) {
      if (!response || !response.credential) return;
      try {
        const payload = JSON.parse(atob(response.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        sessionStorage.setItem('afterGoogleUser', JSON.stringify({name: payload.name || '', email: payload.email || '', picture: payload.picture || ''}));
      } catch (_) {}
      showStatus('Google sign-in successful. Opening store…', 'success');
      window.setTimeout(goToStore, 450);
    }

    function initializeGoogle() {
      if (!window.google || !google.accounts || !google.accounts.id) return;
      if (AFTER_LOGIN.googleClientId.includes('YOUR_GOOGLE_CLIENT_ID')) return;
      google.accounts.id.initialize({
        client_id: AFTER_LOGIN.googleClientId,
        callback: handleGoogleCredential,
        auto_select: false,
        cancel_on_tap_outside: true
      });
      googleReady = true;
    }

    googleButton.addEventListener('click', () => {
      initializeGoogle();
      if (!googleReady) {
        showToast('Add your Google OAuth Client ID in account.html to enable Google account chooser.');
        return;
      }
      google.accounts.id.prompt((notification) => {
        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
          showToast('Google chooser could not be displayed. Check the OAuth client/origin settings.');
        }
      });
    });

    window.addEventListener('load', () => {
      const remembered = localStorage.getItem('afterRememberedUser');
      if (remembered) username.value = remembered;
      initializeGoogle();
    });
  </script>
</body>
</html>
